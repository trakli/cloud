name: UI layer checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    env:
      TRAKLI_UI_LAYERS: ../ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: trakli/webui
          ref: cb53dbdfac2e9da601f2462487d6cae6e38fca29
          path: .host-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .host-ui/package-lock.json
      - name: Install host dependencies
        working-directory: .host-ui
        run: npm ci
      - name: Check layer lint and formatting
        working-directory: .host-ui
        run: npm run check:plugins
      - name: Run host and layer tests
        working-directory: .host-ui
        run: npm run test:run
      - name: Build with layer
        working-directory: .host-ui
        run: npm run build
